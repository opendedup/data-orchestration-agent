[tool.poetry]
name = "data-orchestration-agent"
version = "0.1.0"
description = "Root orchestration agent for data discovery, planning, and product creation using Google ADK"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    {include = "data_orchestration_agent", from = "src"},
    {include = "langgraph_orchestration_agent", from = "src"}
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
google-genai = "^1.0.0"
httpx = "^0.28.1"
pydantic = "^2.10.5"
pydantic-settings = "^2.7.1"
python-dotenv = "^1.0.1"
fastapi = "^0.115.12"
uvicorn = ">=0.35.0"
google-adk = "^1.18.0"
google-cloud-bigquery = "^3.28.0"
sse-starlette = "^2.2.1"
ag-ui-adk = "^0.3.2"
langgraph = "^0.2.60"
langchain = "^0.3.20"
langchain-google-genai = "^2.0.8"
langchain-core = "^0.3.31"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.24.0"
pytest-mock = "^3.14.0"
pytest-cov = "^6.0.0"
ruff = "^0.9.1"
black = "^24.10.0"
responses = "^0.25.3"
respx = "^0.21.1"

[tool.poetry.scripts]
data-orchestration-agent = "data_orchestration_agent.main:main"
langgraph-orchestration-agent = "langgraph_orchestration_agent.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

